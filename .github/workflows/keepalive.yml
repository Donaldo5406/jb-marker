name: keepalive
on:
  schedule:
    - cron: '*/30 * * * *'   # 30분 간격
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space health (sleep 방지)
        run: curl -fsS --max-time 30 "${{ secrets.HF_SPACE_URL }}/health" || true
      - name: Ping Supabase REST (pause 방지 — DB touch)
        run: |
          curl -fsS --max-time 30 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/runs?select=run_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" || true
