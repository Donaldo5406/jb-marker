# 한국 사회 논란·평판 리스크 블랙리스트 (2티어) — Review Studio RC 노드 시드.
#
# ── 티어링 규칙 (국립국어원 표준국어대사전 존재 여부 기준) ─────────────────────
#   Tier 1 = Critical : 사전에 없는 은어·비속어(coined slur) 또는 사전이 '낮잡는 말'로
#            명시한 비속어 — 정상적 사용처가 없다. 매칭 즉시 critical.
#   Tier 2 = Warning  : 전라도·홍어·탱크처럼 평소엔 정상적으로 쓰이나(사전 표제어)
#            맥락에 따라 비하·논란이 되는 명사 — signals + co_signals 결합 시에만 warning.
#
# ── 중립성 (잠금) ────────────────────────────────────────────────────────────
#   정치적 옳고 그름 판단 아님. "이 요소가 특정 논란과 연관되어 의도와 무관하게
#   오해·물의를 부를 수 있다"는 평판 리스크만 표면화한다.
#   ⚠ 중립 정체성어(전라도·경상도·무슬림·이슬람·동성애·게이·트랜스젠더·교회·목사·
#      중국인·난민·흑인 등)는 블랙리스트에서 **의도적으로 제외** — 정상 카피 감시는 그 자체가 논란.
#      비하 파생형(절라도·개슬람·개독·똥꼬충 등)만 트리거로 둔다.
#   ⚠ 정치 조롱어는 진영 무관하게 양측을 함께 넣어 균형을 맞춘다(대깨문·좌빨 ↔ 쥐박이·굥).
#
# ── 오탐 방지 ────────────────────────────────────────────────────────────────
#   '총' 단독 미등록(총액·총자산) → 무기 복합어(총기·총격)만. '한남'(한남동)·'급식'(무료급식)·
#   '통구이'(통닭)·'암컷'(동물) Tier-1 제외 → 슬러 확정형만.
#
# ── 출처/라이선스 ────────────────────────────────────────────────────────────
#   슬러 렉시콘은 공개 상식(나무위키·뉴스)에 널린 '단어 사실'을 큐레이션. 카테고리 택소노미는
#   Korean UnSmile(Smilegate, CC-BY-NC-ND) 분류를 아이디어로만 참고했고 코퍼스 본문은 미포함.
#   TODO(자동화): Tier는 국립국어원 '표준국어대사전(stdict.korean.go.kr)' 또는
#   '우리말샘(opendict.korean.go.kr)' OpenAPI로 사전 존재 여부를 질의해 자동 분류 가능.
#   ⚠ 서비스별 키 등록 필요 — 2026-07-04 실측: 보유 키는 '온용어(kli/term, 전문용어)' 전용이라
#   일반어·은어가 조회되지 않아 부적합(전라도·짱깨 모두 '없음' → 구분 불가). stdict/opendict 키 발급 후 연동.
#   현재 시드는 사전 지식 기반 수동 분류(흔한 단어라 신뢰도 높음).
