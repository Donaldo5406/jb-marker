[project]
name = "jb-marker-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["anthropic>=0.40", "openai>=1.40", "google-genai>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]
supabase = ["supabase>=2", "pyjwt>=2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
