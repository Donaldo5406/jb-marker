[project]
name = "jb-marker-backend"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "Pillow>=10",
]

[project.optional-dependencies]
live = ["anthropic>=0.40", "openai>=1.40", "google-genai>=0.3"]
# dev에 anthropic 포함: advisor live provider 단위 테스트가 `patch("anthropic.Anthropic")`로
# SDK를 모킹하므로, live 키 없이도 모듈이 import 가능해야 함 (실제 API 호출은 없음).
dev = ["pytest>=8", "httpx>=0.27", "anthropic>=0.40"]
supabase = ["supabase>=2", "pyjwt[crypto]>=2"]
observability = ["langfuse>=3,<4", "sentry-sdk[fastapi]>=2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
